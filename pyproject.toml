[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "dopamine-drawing"
version = "0.1.0"
description = "A MaleCNS fly-brain subnetwork learns to draw with a simulated Franka Panda through reward-modulated STDP."
readme = "README.md"
requires-python = ">=3.10"
# Exact pins are in requirements.txt; these are the import-time needs.
dependencies = ["numpy", "scipy", "pandas", "pyarrow", "torch", "mujoco"]

[project.optional-dependencies]
viz = ["matplotlib", "imageio", "imageio-ffmpeg", "pillow"]
data = ["neuprint-python", "requests"]
test = ["pytest"]

[tool.setuptools]
packages = ["dopamine_drawing"]

[tool.pytest.ini_options]
testpaths = ["tests"]
